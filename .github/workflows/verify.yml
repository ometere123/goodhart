name: Verify Goodhart (StudioNet 61999 release)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned local CLI
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify local CLI and immutable environment
        run: |
          npm run cli:version
          npm run preflight
          python -m compileall -q contracts scripts tests
      - name: GenVM lint and schema (pinned runner v0.2.12)
        env:
          GENVM_VERSION: v0.2.12
          PYTHONIOENCODING: utf-8
        run: |
          genvm-lint check contracts/goodhart.py
          genvm-lint check contracts/reward_gate.py
          genvm-lint schema contracts/goodhart.py --json > goodhart.schema.json
          genvm-lint schema contracts/reward_gate.py --json > reward_gate.schema.json
      - name: Host-side tests
        run: npm run test:offline
      - name: Focused mutation checks
        run: npm run test:mutation
      - name: Native Direct Mode tests (GenVM v0.2.12)
        run: python -m pytest -q tests/direct
      - name: Verify explicit StudioNet 61999 endpoint
        run: npm run network:check
      - name: Dependency audit (locked graph)
        run: npm audit --omit=dev --omit=optional --audit-level=high
