name: Verify Goodhart (StudioNet 61999 release)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned local CLI
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify local CLI and immutable environment
        run: |
          npm run cli:version
          npm run preflight
          python -m compileall -q contracts scripts tests
      - name: Host-side tests
        run: npm run test:offline
      - name: Native Direct Mode tests (GenVM v0.2.12)
        run: python -m pytest -q tests/direct
      - name: Verify explicit StudioNet 61999 endpoint
        run: npm run network:check
